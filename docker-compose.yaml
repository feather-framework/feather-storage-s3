services:
    minio:
        build:
            context: .
            dockerfile: docker/minio/Dockerfile
        ports:
            - '127.0.0.1:9100:9000'
            - '127.0.0.1:9101:9001'
        environment:
            MINIO_ROOT_USER: miniouser
            MINIO_ROOT_PASSWORD: miniopassword
            MINIO_ACCESS_KEY_ID: cHXky6PdP5WGhrC5MMyd
            MINIO_SECRET_ACCESS_KEY: 7diqcEnfBESz9MurK4HiNd4WgVydhj6AIZw1Hj9Q
            MINIO_REGION_NAME: us-east-1
            MINIO_BUCKET_NAME: miniobucket
        volumes:
            - 'miniodata:/data'
        healthcheck:
            test:
                - CMD
                - mc
                - ready
                - local
            interval: 5s
            timeout: 5s
            retries: 5

    tests:
        build:
            context: .
            dockerfile: docker/tests/Dockerfile
        depends_on:
            minio:
                condition: service_healthy
        environment:
            FEATHER_STORAGE_S3_TEST_ENDPOINT: http://minio:9000

volumes:
    miniodata:
